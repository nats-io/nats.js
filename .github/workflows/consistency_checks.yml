name: Workspace Consistency Checks

on:
  workflow_call:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno-version: [2.9.x]
        module: [
          core,
          jetstream,
          kv,
          obj,
          services,
          nst,
          transport-deno,
          transport-node,
        ]

    steps:
      - name: Git Checkout Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Deno ${{ matrix.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Lint Deno Modules
        run: |
          deno fmt --check ${{ matrix.module }}/
          deno lint ${{ matrix.module }}/

  versions:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x

      # module versions agree across deno.json, package.json and version.ts,
      # pins on our modules match, and the nuid/nkeys pins agree everywhere
      - name: Check Versions
        run: deno task check-versions
